services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  carshare:
    build:
      context: ./carshare
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${CARSHARE_API_PORT:-8080}
      DATABASE_URL: postgres://role_tooling:${ROLE_TOOLING_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CARSHARE_DEFAULT_PROJECT: ${CARSHARE_DEFAULT_PROJECT:-shared-car}
      CARSHARE_PROJECT_NAME: ${CARSHARE_PROJECT_NAME:-Shared Car}
      CARSHARE_CURRENCY: ${CARSHARE_CURRENCY:-EUR}
      CARSHARE_BASELINE_PRICE_PER_LITER: ${CARSHARE_BASELINE_PRICE_PER_LITER:-1.80}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-runtime:
    build:
      context: .
      dockerfile: ./runtime/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      carshare:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://role_runtime:${ROLE_RUNTIME_PASSWORD:-change-me-too}@postgres:5432/${POSTGRES_DB}
      CARSHARE_API_BASE_URL: http://carshare:8080
      CARSHARE_PROJECT_SLUG: ${CARSHARE_DEFAULT_PROJECT:-shared-car}
      AGENT_RUNTIME_TELEGRAM_ENABLED: ${AGENT_RUNTIME_TELEGRAM_ENABLED:-false}
      AGENT_RUNTIME_ALLOW_IN_MEMORY_STORE: "false"
      AGENT_RUNTIME_DEFAULT_MODEL_ID: ${AGENT_RUNTIME_DEFAULT_MODEL_ID:-moonshotai.kimi-k2.5}
    ports:
      - "127.0.0.1:${AGENT_RUNTIME_PORT:-19080}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
