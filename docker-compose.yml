services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  carshare:
    build:
      context: ./carshare
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${CARSHARE_API_PORT:-8080}
      DATABASE_URL: postgres://role_tooling:${ROLE_TOOLING_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CARSHARE_DEFAULT_PROJECT: ${CARSHARE_DEFAULT_PROJECT:-shared-car}
      CARSHARE_PROJECT_NAME: ${CARSHARE_PROJECT_NAME:-Shared Car}
      CARSHARE_CURRENCY: ${CARSHARE_CURRENCY:-EUR}
      CARSHARE_BASELINE_PRICE_PER_LITER: ${CARSHARE_BASELINE_PRICE_PER_LITER:-1.80}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  openclaw:
    build:
      context: ./openclaw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      carshare:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json5
      OPENCLAW_STATE_DIR: /var/lib/openclaw
      CARSHARE_API_BASE_URL: ${CARSHARE_API_BASE_URL:-http://carshare:8080}
      CARSHARE_DEFAULT_PROJECT: ${CARSHARE_DEFAULT_PROJECT:-shared-car}
    volumes:
      - ./openclaw/config:/etc/openclaw
      - openclaw_state:/var/lib/openclaw
    ports:
      - "127.0.0.1:18789:18789"
    command: ["openclaw", "gateway"]

volumes:
  pgdata:
  openclaw_state:
