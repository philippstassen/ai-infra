id: carshare-ledger
description: Route carshare messages to one goal-directed persistence agent that gathers required data, calls Carshare Service tools, and reads back results.
nodes:
  receive_message:
    type: input
  carshare_persistence:
    type: agent
    agent: carshare_persistence
    skill: carshare-agent-skill
  send_response:
    type: output
edges:
  - from: receive_message
    to: carshare_persistence
  - from: carshare_persistence
    to: send_response
